<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaay Billing and Inventory Management</title>
<meta name="theme-color" content="#0C2340">
<link rel="icon" href="logos/pah.png">
<link rel="apple-touch-icon" href="logos/pah.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a parts-counter ledger. Navy rail on the left, dense white ledger sheets,
   document numbers stamped as licence plates, amber reserved for the one primary action. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#0F1E33; --muted:#5A6A80; --line:#D9E0E9;
  --rail:#0C2340; --rail-ink:#DCE6F2; --brand:#1558B0; --brand-ink:#FFFFFF;
  --accent:#F5A300; --accent-ink:#231800;
  --good:#16794F; --bad:#C2362C; --warn:#9A6400; --tint:#E7EEF7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1420; --surface:#111E2E; --ink:#E7EDF5; --muted:#93A3B8; --line:#24364D;
    --rail:#07111D; --rail-ink:#C9D6E6; --brand:#62A6F7; --brand-ink:#06121F;
    --accent:#FFB829; --accent-ink:#231800;
    --good:#4CC38A; --bad:#F27B70; --warn:#F0B44C; --tint:#16273B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1420; --surface:#111E2E; --ink:#E7EDF5; --muted:#93A3B8; --line:#24364D;
  --rail:#07111D; --rail-ink:#C9D6E6; --brand:#62A6F7; --brand-ink:#06121F;
  --accent:#FFB829; --accent-ink:#231800;
  --good:#4CC38A; --bad:#F27B70; --warn:#F0B44C; --tint:#16273B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:0.9375rem/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.75rem;line-height:1.1} h2{font-size:1.25rem} h3{font-size:1rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
#app{display:grid;grid-template-columns:232px 1fr;height:100%}
#side{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:18px;padding:18px 14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.625rem;font-weight:700;color:#fff;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-size:0.6875rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
#storeLogo{display:block;width:100%;max-height:84px;object-fit:contain;background:#fff;border-radius:6px;padding:8px;margin-bottom:10px}
.docu .logo{max-height:56px;max-width:220px;display:block;margin-bottom:6px;background:#fff;border-radius:4px;padding:3px}
#side select{width:100%;background:#ffffff14;border:1px solid #ffffff2e;color:#fff;border-radius:6px;padding:8px}
#side select option{color:#111}
#nav{display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:inherit;text-decoration:none;font-weight:500;border-left:3px solid transparent}
#nav a:hover{background:#ffffff12}
#nav a[aria-current="page"]{background:#ffffff1c;color:#fff;border-left-color:var(--accent)}
#nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:0.75rem;opacity:.75;display:flex;flex-direction:column;gap:8px}
.lang{display:flex;gap:6px}
.lang button{background:none;border:1px solid #ffffff3a;color:inherit;border-radius:4px;padding:3px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--rail);border-color:#fff;font-weight:600}
main{overflow:auto;min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding:20px 22px 90px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.head .acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:0.8125rem}
.banner{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:6px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line)}
.tile.in{border-top-color:var(--good)} .tile.out{border-top-color:var(--bad)} .tile.b{border-top-color:var(--brand)} .tile.w{border-top-color:var(--accent)}
.tile span{font-size:0.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile b{font-family:var(--display);font-size:1.5625rem;font-weight:600;line-height:1.15}
.tile em{font-style:normal;font-size:0.75rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:15px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card .tbl-wrap{border:0;border-radius:0}
table{width:100%;border-collapse:collapse}
th{font-size:0.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody td:first-child{min-width:150px}
tbody tr.row:hover{background:var(--tint)}
.r{text-align:right}
.sub{font-size:0.8125rem;color:var(--muted)}
.plate{display:inline-block;font-family:var(--display);font-weight:600;font-size:0.875rem;letter-spacing:.08em;border:1.5px solid var(--ink);border-radius:4px;padding:0 6px;background:var(--surface);white-space:nowrap}
.pill{display:inline-block;font-size:0.75rem;font-weight:600;border-radius:99px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.mute{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{flex:1;min-width:180px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,calc(100vw - 24px));max-height:calc(var(--vvh,100dvh) - 24px)}
dialog::backdrop{background:#0a1420b3}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.db{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.df{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:0.7812rem;font-weight:600;color:var(--muted)}
label.f>*{font-weight:400;color:var(--ink);font-size:0.9375rem}
label.chk{display:flex;align-items:center;gap:8px;font-weight:500}
label.chk input{width:auto}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,3fr) 76px 110px minmax(84px,1fr) 34px;gap:6px;align-items:center}
.line .lt{text-align:right;font-weight:600}
.line .hint{grid-column:1/-1;font-size:0.8125rem;color:var(--warn)}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1.25rem;line-height:1;padding:4px}
.tot{margin-left:auto;display:grid;grid-template-columns:auto auto;gap:4px 22px;align-items:center}
.tot .big{font-family:var(--display);font-size:1.5rem;font-weight:600}
.docu{border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.docu .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.card,.tile,.tbl-wrap{box-shadow:0 1px 2px #0f1e330f}
.who{display:flex;gap:11px;align-items:center;min-width:0}
.who>div{min-width:0}
.ava{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;font:600 0.9375rem var(--display);letter-spacing:.03em;color:#fff;background:hsl(var(--h) 46% 42%);flex:none}
.ava.rd{border-radius:50%}
.ic{width:38px;height:38px;border-radius:10px;display:inline-grid;place-items:center;background:var(--tint);color:var(--brand);flex:none}
.ic svg{width:19px;height:19px}
.ic.g{color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.ic.r{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
.ic.a{color:var(--warn);background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.ic.m{color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.money{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--surface);box-shadow:0 1px 2px #0f1e330f;min-width:0}
.money.in{background:color-mix(in srgb,var(--good) 8%,var(--surface));border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.money.out{background:color-mix(in srgb,var(--bad) 7%,var(--surface));border-color:color-mix(in srgb,var(--bad) 28%,var(--line))}
.money div{display:flex;flex-direction:column;min-width:0}
.money span{font-size:0.75rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--muted)}
.money b{font-family:var(--display);font-size:1.625rem;font-weight:600;line-height:1.15}
.money.in b{color:var(--good)} .money.out b{color:var(--bad)}
.money em{font-style:normal;font-size:0.75rem;color:var(--muted)}
.qas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;border:0;background:none;border-radius:10px;cursor:pointer;font-size:0.8125rem;font-weight:500;text-align:center;line-height:1.2}
.qa:hover{background:var(--tint)}
.qa .ic{width:46px;height:46px;border-radius:14px} .qa .ic svg{width:22px;height:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:500;font-size:0.8438rem;white-space:nowrap}
.chip small{color:var(--muted);font-size:0.75rem;margin-left:3px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:0.8438rem}
.strip b{color:var(--ink)}
.mtop{display:none}
body.nocost .cst{display:none!important}
body.locked #side,body.locked .fab{display:none!important}
body.locked #app{grid-template-columns:1fr;grid-template-rows:1fr}
body.locked .wrap{max-width:none;padding:0;min-height:100%;gap:0}
.lform .link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:10px 0;text-align:left;min-height:44px}
.login{display:grid;grid-template-columns:minmax(300px,5fr) 6fr;min-height:100vh;min-height:100dvh}
.lbrand{background:var(--sc);color:var(--sct);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;overflow:hidden}
.lbrand::after{content:"";position:absolute;right:-140px;bottom:-140px;width:420px;height:420px;border-radius:50%;border:46px solid currentColor;opacity:.08}
.lbrand img{width:min(260px,70%);background:#fff;border-radius:12px;padding:14px;position:relative}
.lbrand h1{font-size:2.75rem;line-height:1.02;color:inherit;position:relative}
.lbrand .tag{font-family:var(--display);font-size:1.0625rem;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.lbrand dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:8px 0 0;position:relative}
.lbrand dt{opacity:.65;font-size:0.75rem;text-transform:uppercase;letter-spacing:.08em;padding-top:3px}
.lbrand dd{margin:0}
.lbrand small{opacity:.6;position:relative;margin-top:10px}
.lform{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:40px clamp(20px,6vw,72px);width:100%;max-width:520px;margin:0 auto}
.lform h2{font-size:1.875rem}
.lform form{display:flex;flex-direction:column;gap:14px}
.lform input:not([type=checkbox]){padding:11px 12px;font-size:1rem}
.lform .btn.pri{justify-content:center;padding:12px;font-size:1rem}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:0.8125rem}
@media (max-width:820px){.login{grid-template-columns:1fr;grid-template-rows:auto 1fr}.lbrand{padding:28px 22px;gap:10px}.lbrand h1{font-size:2rem}.lbrand img{width:150px;padding:8px}.lform{padding:24px 22px 40px;justify-content:flex-start}}
.staffgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.staffbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:600}
.staffbtn[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.staffbtn .ava{width:52px;height:52px;font-size:1.25rem}
.staffbtn small{font-weight:400;color:var(--muted)}
#whoBox{display:flex;align-items:center;justify-content:space-between;gap:8px}
#whoBox button{background:none;border:1px solid #ffffff3a;color:inherit;border-radius:4px;padding:3px 9px;cursor:pointer}
.fab{display:none}
.mo{display:none!important}
.more a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-weight:600}
.more a:last-child{border-bottom:0}
.scan{display:flex;gap:8px;align-items:center;background:var(--tint);border-radius:8px;padding:8px 10px}
.scan svg{width:20px;height:20px;flex:none;color:var(--brand)}
.scan input{background:var(--surface)}
.idl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:0}
.idl dt{color:var(--muted);font-size:0.8125rem}.idl dd{margin:0}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.8125rem;letter-spacing:.02em}
td input.qin{width:78px;padding:5px 7px;text-align:right}
td input[type=checkbox]{width:auto}
.grp{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
tbody tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.btn:active,.chip:active,.qa:active,.seg button:active,.money:active{transform:translateY(1px);filter:brightness(.96)}
tbody tr.row:active{background:var(--tint)}
.chip:hover,.money:hover{border-color:var(--brand)}
.btn:disabled,.btn[aria-busy="true"]{opacity:.6;cursor:progress;transform:none}
.sk{display:block;background:var(--line);border-radius:8px;animation:skp 1.2s ease-in-out infinite}
@keyframes skp{50%{opacity:.45}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
@media (pointer:coarse){
  .btn,.btn.sm,.seg button,.chip,.lang button,#whoBox button{min-height:44px}
  .x{min-width:44px;min-height:44px}
  input:not([type=checkbox]):not([type=radio]),select{min-height:44px}
  label.chk input,td input[type=checkbox],input[type=radio]{width:22px;height:22px}
  label.chk{min-height:44px}
}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}
.bars text{font:0.6875rem var(--body);fill:var(--muted)}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #side{flex-direction:row;align-items:center;padding:6px 8px;gap:6px;order:2;overflow-x:auto}
  #side .brand,#side .side-foot,#side .store{display:none}
  #nav{flex-direction:row;gap:2px}
  #nav a{flex-direction:column;gap:2px;font-size:0.75rem;padding:6px 10px;border-left:0;border-top:3px solid transparent;white-space:nowrap}
  #nav a[aria-current="page"]{border-top-color:var(--accent)}
  .wrap{padding:14px 16px 30px}
  .grid2{grid-template-columns:1fr}
  .mob{display:flex!important}
  .hm{display:none}
  #side{overflow:hidden;padding:4px 6px}
  #nav{width:100%}
  #nav a{flex:1;justify-content:center;padding:7px 2px}
  #nav a.dm{display:none}
  #nav a.mo{display:flex!important}
  .mtop{display:flex;justify-content:space-between;align-items:center;gap:10px} .mtop img{height:40px;background:#fff;border-radius:6px;padding:3px}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:74px;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.875rem;line-height:1;box-shadow:0 4px 14px #0006;cursor:pointer;z-index:5}
  .duo{grid-template-columns:1fr} .money b{font-size:1.4375rem}
  .qas{grid-template-columns:repeat(4,1fr);gap:4px} .qa{font-size:0.75rem}
  tbody td:first-child{min-width:0}
  td,th{padding:9px 10px}
  .line{grid-template-columns:72px minmax(0,1fr) auto 44px;row-gap:6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .line>input[data-f=name]{grid-column:1/-1}
  .line .lt{text-align:right;font-size:0.9375rem;min-width:64px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .tile b{font-size:1.3125rem}
}
.mob{display:none;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="#62A6F7" stroke-width="4"/><circle cx="20" cy="20" r="4.5" fill="#F5A300"/><path d="M20 24.5V37M16 18.5 4.5 14M24 18.5 35.5 14" stroke="#62A6F7" stroke-width="4" stroke-linecap="round"/></svg>
      <div><b>JAAY</b><small id="tagline"></small></div>
    </div>
    <div class="store"><img id="storeLogo" alt="" hidden><select id="storeSel" aria-label="Store" hidden></select></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="lang"><button type="button" data-a="lang" data-id="en">EN</button><button type="button" data-a="lang" data-id="fr">FR</button></div>
      <div id="whoBox"></div>

const HMAP = { ref:['ref-article','ref','reference','référence','part number','sku'], brand:['fabricant','brand','marque'], type:['type de pièce','type de piece','type','category','catégorie','désignation','designation','name','nom'], qty:['quantité','quantite','qty','quantity'], price:['prix de vente unitaire','prix de vente','prix','price','selling price'], cost:["prix d'achat",'cost','coût'], sold:['vendu','sold'], left:['restant','remaining','in stock'], note:['note','notes'] };
const money = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const nk = v => String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function parseTab(title, rows){
  let hi = -1, col = {};
  for(let i = 0; i < Math.min(rows.length, 10); i++){
    const c = {}; (rows[i] || []).forEach((h, j) => { const k = String(h == null ? '' : h).trim().toLowerCase(); for(const f in HMAP) if(!(f in c) && HMAP[f].includes(k)) c[f] = j; });
    if('ref' in c && ('type' in c || 'qty' in c)){ hi = i; col = c; break; }
  }
  if(hi < 0) return null;
  const g = (r, f) => f in col ? String(r[col[f]] == null ? '' : r[col[f]]).trim() : '', out = [];
  for(let i = hi + 1; i < rows.length; i++){
    const r = rows[i] || [], ref = g(r, 'ref'); if(!ref) continue;
    const left = g(r, 'left');
    out.push({ ref, type: g(r, 'type') || title, brand: g(r, 'brand'), price: money(g(r, 'price')), cost: money(g(r, 'cost')), stock: left !== '' ? money(left) : money(g(r, 'qty')) - money(g(r, 'sold')), note: g(r, 'note'), tab: title });
  }
  return out;
}
function buildImport(sheets){
  const tabs = []; for(const [title, rows] of sheets){ const r = parseTab(title, rows || []); if(r && r.length) tabs.push({ title, rows: r, on: true, flag: false }); }
  for(const tb of tabs){
    const others = new Set(); let hit = 0;
    for(const r of tb.rows){ let found = false; for(const o of tabs) if(o !== tb && o.rows.some(x => nk(x.ref) === nk(r.ref))){ others.add(o.title); found = true; } if(found) hit++; }
    if(tb.rows.length >= 5 && hit / tb.rows.length >= 0.6 && others.size >= 3){ tb.flag = true; tb.on = false; }
  }
  return { tabs, dup: 'sum' };
}
function mergeImport(imp, existing){
  const have = new Set(Object.values(existing).map(it => nk(it.sku) + '|' + nk(it.brand))), map = new Map(); let skipped = 0;
  for(const tb of imp.tabs) if(tb.on) for(const r of tb.rows){
    const k = nk(r.ref) + '|' + nk(r.brand);
    if(have.has(k)){ skipped++; continue; }
    const m = map.get(k);
    if(!m) map.set(k, Object.assign({}, r));
    else if(imp.dup === 'sum'){ m.stock += r.stock; if(!m.price) m.price = r.price; if(!m.note) m.note = r.note; }
  }
  const fresh = [...map.values()];
  return { fresh, skipped, units: fresh.reduce((s, r) => s + Math.max(0, r.stock), 0), value: fresh.reduce((s, r) => s + Math.max(0, r.stock) * r.price, 0) };
}
