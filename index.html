<style>
/* Jaay design system.
   Grid: every space is a multiple of 4px. Radius: 4px (controls) and 8px (containers).
   Colour: quiet slate neutrals; ONE accent (amber) for the primary action, the current page and focus.
   Green and red appear only on figures that mean money in / money out or a problem.
   Type: Barlow only. Scale 12 / 13 / 15 / 18 / 24 / 32. Icons: 20px, 1.5 stroke.
   Elevation: surface-1 (page) vs surface-2 (sheets) and 1px borders. No shadows.
   Motion: 150ms on colour and opacity only. */
:root{

  --r1:4px; --r2:8px;

  --rail:#1B2233; --rail-ink:#C9CDD6; --brand:#262C3B; --brand-ink:#FFFFFF;
  --accent:#E8A317; --accent-ink:#1F1600;
  --good:#1E7A4F; --bad:#B8382E; --warn:#8C6200; --tint:#EEF0F3;
  --display:var(--body);
  --body:"Barlow","Segoe UI",Helvetica,Arial,sans-serif;
  --ease:150ms ease;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111318; --surface:#181B22; --surface-3:#1D2129; --ink:#E7E9EE; --muted:#9AA0AD; --line:#2A2F3A; --line-2:#3A404C;
    --rail:#0D0F14; --rail-ink:#B9BEC9; --brand:#E7E9EE; --brand-ink:#111318;
    --accent:#F0B232; --accent-ink:#1F1600;
    --good:#4FBF86; --bad:#EE7A6F; --warn:#E3B04F; --tint:#20242D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111318; --surface:#181B22; --surface-3:#1D2129; --ink:#E7E9EE; --muted:#9AA0AD; --line:#2A2F3A; --line-2:#3A404C;
  --rail:#0D0F14; --rail-ink:#B9BEC9; --brand:#E7E9EE; --brand-ink:#111318;
  --accent:#F0B232; --accent-ink:#1F1600;
  --good:#4FBF86; --bad:#EE7A6F; --warn:#E3B04F; --tint:#20242D;

*{box-sizing:border-box}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r1);overflow:hidden;background:var(--surface)}

function monRange(){
  const d = new Date(), td = iso(d);
  if(monPeriod === 'yesterday'){ const y = iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1)); return [y, y]; }
  if(monPeriod === '7d') return [iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 6)), td];
  if(monPeriod === 'month') return [td.slice(0, 8) + '01', td];
  return [td, td];
}
function watchLog(){
  if(route !== 'monitor' || role() !== 'owner' || !storeId){ if(logUnsub) stopLog(); return; }

  if(logUnsub && logSince === since) return;
  if(logUnsub) logUnsub();
  logSince = since; logLoaded = false;
  logUnsub = db.recent('stores/' + storeId + '/log', { since:new Date(since + 'T00:00:00'), limit:3000 }).onSnapshot(sn => {
    S.log = sn.docs.map(d => Object.assign({ id:d.id }, d.data())); logLoaded = true; render();
  }, e => { logLoaded = true; liveErr(e); render(); });
}

function moves(id){
  const it = S.items[id], out = []; let bal = num(it.opening);
  const list = Object.entries(S.txns).sort((a, b) => (a[1].date || '').localeCompare(b[1].date || '') || (a[1].createdAt || 0) - (b[1].createdAt || 0));
  for(const [tid, x] of list){
    let q = 0;
    if(x.type === 'adjust' && x.itemId === id) q = num(x.qty);
    else if(x.type === 'sale' || x.type === 'purchase' || x.type === 'return') for(const l of x.lines || []) if(l.itemId === id) q += x.type === 'sale' ? -num(l.qty) : num(l.qty);
    if(!q) continue; bal += q; out.push({ id:tid, x, q, bal });
  }
  return out.reverse();
}

/* ---------- global search: one bar on every page (item name, code or part number, order number, customer name or phone) ---------- */
let gsQ = '';
function gsFind(){
  const k = gsQ.trim().toLowerCase(), d = k.replace(/\D/g, ''), ph = d.length >= 4 ? (d.length >= 9 ? pk(d) : d) : '', out = [];
  if(k.length < 2) return out;
  const has = (...f) => f.some(v => String(v || '').toLowerCase().includes(k)), hasPh = (...f) => !!ph && f.some(v => { const p = pk(v); return p && (d.length >= 9 ? p === ph : p.includes(ph)); });
  const add = (grp, key, title, sub) => { const g = out.find(o => o[0] === grp) || (out.push([grp, []]), out[out.length - 1]); if(g[1].length < 5) g[1].push([key, title, sub]); };
  if(allowed('items')) for(const id in S.items){ const it = S.items[id]; if(has(it.name, it.code, it.sku, it.brand)) add('Items', 'item:' + id, it.name, [it.code, it.sku, it.brand].filter(Boolean).join(' · ')); }
  if(allowed('sales') || allowed('purchases')){
    const ok = x => ['sale', 'quote', 'return'].includes(x.type) ? allowed('sales') : ['po', 'purchase'].includes(x.type) ? allowed('purchases') : false;
    for(const id in S.txns){ const x = S.txns[id]; if(ok(x) && (has(x.no) || hasPh(x.custPhone))) add('Documents', 'doc:' + id, typeLabel(x) + ' ' + (x.no || ''), fdate(x.date) + ' · ' + partyName(x) + ' · ' + fmt(x.total)); }
  }
  if(allowed('parties')) for(const id in S.parties){ const p = S.parties[id]; if(has(p.name) || hasPh(p.phone)) add('Customers and suppliers', 'party:' + id, p.name, p.phone || ''); }
  if(seeCrm() && allowed('customers')) crmList().forEach(c => { if(has(c.name) || hasPh(c.mobile, c.phone2, c.phone3)) add('Customers and suppliers', 'contact:' + c.id, c.name, c.mobile || ''); });
  return out;
}

    await putStore(storeId, Object.assign({}, store(), { logo: out })); render(); toast(t('Logo saved.'));

}

function formPerm(name){
  if(name === 'login' || name === 'firstOwner' || name === 'createStore' || name === 'changePw') return null;
  if(name === 'newStore') return Object.keys(S.stores).length ? 'setup' : null;
  if(name === 'labels') return 'items';
  if(name === 'txn') return F.id || F.x.type === 'return' ? 'edit' : F.x.type === 'purchase' || F.x.type === 'po' ? 'buy' : 'sell';
  if(name === 'money') return F.id ? 'edit' : F.type === 'expense' ? (F.request ? 'expreq' : 'expense') : F.type;
  if(name === 'reject') return 'approve';
  if(name === 'void') return 'del';
  if(name === 'flag') return 'sell';
  if(name === 'contact') return 'crm';
  if(name === 'deal') return 'promo';
  if(name === 'promoRec') return 'promo';
  if(name === 'bill' || name === 'budgets') return 'expense';
  return { item:'items', adjust:'items', party:'party' }[name] || 'setup';
}

    if((x.type === 'sale' || x.type === 'quote') && v.cameFrom) x.cameFrom = String(v.cameFrom).slice(0, 20); else delete x.cameFrom;
    Object.assign(x, { partyId:v.partyId || '', date:v.date, note:v.note || '', discount:num(v.discount), sub:c.sub, cogs:c.cogs, taxRate:c.taxRate, taxAmt:c.taxAmt, coreAmt:c.coreAmt, total:c.total }); if(!c.coreAmt) delete x.coreAmt; else if(!x.coreSt) x.coreSt = 'pending';
    if(x.type === 'quote' || x.type === 'po'){ x.paid = 0; } else { x.paid = Math.min(num(v.paid), c.total); x.method = v.method; }
    if(!x.partyId && x.type === 'sale' && x.paid < c.total) toast(t('Walk-in sale left unpaid. Add the customer as a party to track what they owe.'));
    if(!x.no){ x.no = nextNo(x.type); for(let g = 0; g < 50 && Object.entries(Object.assign({}, S.voided, S.txns)).some(([k, o]) => k !== id && o.type === x.type && o.no === x.no); g++){ const m = /^(.*?)(\d+)$/.exec(x.no); x.no = m ? m[1] + String(+m[2] + 1).padStart(m[2].length, '0') : x.no + '-2'; } }
    if(!F.id){ x.createdAt = Date.now(); x.by = me() ? me().name : ''; }
    delete x.id;
    dlg.close(); await put('txns', id, x); toast(docTitle(x.type) + ' ' + x.no + ' · ' + t('saved'));
    // a walk-in customer who gave a new number joins the customer list
    if(x.type === 'sale' && x.custPhone && can('crm') && seeCrm() && !crmList().some(c => [c.mobile, c.phone2, c.phone3].some(v => pk(v) === pk(x.custPhone)))){
      crmPut('c' + uid(), { name:x.partyName || t('Walk-in customer') + ' ' + x.custPhone.slice(-9), type:'Particulier', sector:'Particulier', mobile:x.custPhone, brands:[], tags:x.partyName ? [] : ['Nom à compléter'], sms:'unknown', emailOk:'unknown', activity:[], source:t('Counter sale') + ' ' + x.no, createdAt:Date.now() }).catch(() => {});
    }
  }
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  const v = {}; new FormData(f).forEach((val, k) => { v[k] = String(val).trim(); });
  if(f.dataset.busy) return;
  const need = formPerm(f.dataset.form); if(need && !can(need)) return toast(t('Not allowed for your access level.'));
  f.dataset.busy = '1'; const sb = f.querySelector('button:not([type=button])'), lbl = sb && sb.textContent;
  if(sb){ sb.disabled = true; sb.setAttribute('aria-busy', 'true'); sb.textContent = t('Saving…'); }
  Promise.resolve().then(() => SUBMIT[f.dataset.form](v)).catch(fail).finally(() => { delete f.dataset.busy; if(sb){ sb.disabled = false; sb.removeAttribute('aria-busy'); sb.textContent = lbl; } });
});

if(typeof module !== 'undefined') module.exports = { hashPw, verifyPw, pinHash, genCode, ab3, dayClose, moves, D:() => D, setD:d => { D = d; }, PW_OK, UN_OK, lum, can, allowed, ROLES, calc, derive, pnl, n0, nextNo, S, billState, addMonths, dueOn, opexTotals, periodRange, parseTab, buildImport, mergeImport };
else start();
